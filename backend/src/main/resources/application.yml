server:
  port: 8080
  forward-headers-strategy: none
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/xml,text/html,text/plain,text/css,application/javascript

spring:
  application:
    name: InterHub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interview_online}
    username: ${DB_USER:interview}
    password: ${DB_PASSWORD:interview}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  social-auth:
    enabled: ${FEATURE_SOCIAL_AUTH_ENABLED:false}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
    flow-secret: ${SOCIAL_AUTH_FLOW_SECRET:}
    google:
      enabled: ${GOOGLE_AUTH_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    vk:
      enabled: ${VK_AUTH_ENABLED:false}
      client-id: ${VK_CLIENT_ID:}
      service-token: ${VK_SERVICE_TOKEN:}
  features:
    team-merge-commit-enabled: ${FEATURE_TEAM_MERGE_COMMIT:false}
  team-invitation-link-encryption:
    active-key-id: ${TEAM_INVITATION_LINK_ENCRYPTION_ACTIVE_KEY_ID:}
  http:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:}
  realtime:
    chat-receipt-hmac-secret: ${CHAT_RECEIPT_HMAC_SECRET}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
  agent:
    default-provider: ${AGENT_DEFAULT_PROVIDER:temporal}
    default-workflow-name: ${AGENT_DEFAULT_WORKFLOW_NAME:task_orchestration}
    observability:
      service-name: ${AGENT_OBS_SERVICE_NAME:interview-online-agent}
      langfuse-enabled: ${AGENT_LANGFUSE_ENABLED:false}
      langfuse-url: ${AGENT_LANGFUSE_URL:}
      langfuse-api-key: ${AGENT_LANGFUSE_API_KEY:}
    linear:
      enabled: ${AGENT_LINEAR_SYNC_ENABLED:false}
      api-url: ${LINEAR_API_URL:https://api.linear.app/graphql}
      api-key: ${LINEAR_API_KEY:}
      status-map:
        BACKLOG: Backlog
        REFINEMENT: Backlog
        READY: Взято в разработку
        IN_PROGRESS: В работе (Back)
        IN_REVIEW: In Review
        QA: Передано на Front
        DONE: Выполнено
        BLOCKED: Backlog
