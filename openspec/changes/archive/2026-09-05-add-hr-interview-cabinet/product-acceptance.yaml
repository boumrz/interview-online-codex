decisions:
  - "Accept HR-056; no additional product clarification, requirement or implementation is needed for this MVP."
  - "Preserve room-local candidate/interviewer semantics and the optional HR account marker exactly as the user clarified."
  - "Treat the security review's pre-existing account-session hardening note as a separate future scope, not a newly imposed acceptance condition."
risks:
  - "Existing non-expiring account sessions remain the explicitly nonblocking platform note in security-review.yaml."
  - "Export bounds are documented transaction/cooperative limits, not a hard end-to-end HTTP latency guarantee; verified workload is 1000 interviews and 5000 task scores."
  - "Backend/migration-first rollout and archive-compatible rollback remain operational requirements; production deployment has not been asserted by product acceptance."
