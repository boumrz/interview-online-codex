    Optional HR profile marker, UUID invitation, room-local manager admission,
    automatic tracking, personal cabinet, metadata/results, date filtering,
    retained read-only archive, XLSX, identity changes, current permissions,
    transactions, migrations and affected realtime/guest/account regressions.
  approach: >-
    Audit actual assertions and raw outcomes rather than infer coverage from
    test names. Reuse the completed final test runs; run an existing bounded
    scenario only for a concrete missing priority area. Browser flows use real
    PostgreSQL-backed authority. Network interception in HR E2E is limited to
    explicitly controlled failure/latency cases. MockMvc covers forged requests
    and transaction interleavings; OOXML parsing verifies workbook contents;
    actual PostgreSQL proves migrations, locking, workload and restart behavior.
