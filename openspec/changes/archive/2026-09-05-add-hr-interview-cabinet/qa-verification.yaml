bugs:
  - id: BUG-HR-QA-001
    severity: high
    status: resolved
    summary: "After-commit permission callbacks exhaust the database pool under concurrent HR invitation"
    steps: >-
      1. Use the isolated PostgreSQL packaged runtime with the default ten-connection pool.
      2. Create an owner, HR target and room.
      3. In a separate PostgreSQL connection execute BEGIN and SELECT id FROM rooms
      WHERE id = the created room ID FOR UPDATE.
      4. Barrier-start twelve authorized PUT requests to the room's hr-managers/{targetId} endpoint.
      5. Wait until pg_stat_activity shows ten connections waiting on a lock.
      6. Commit the external transaction and collect all twelve responses.
      The exact fixture/probe is python3 output/hr-pool-probe.py.
    expected: "Every request succeeds idempotently; permission refresh completes without acquiring connections indefinitely while retaining all outer connections."
    original_actual: >-
      Four requests return HTTP 500 approximately 30 seconds after lock release.
      Root observed Hikari active=10 and waiting=8. afterCommit invokes a
      REQUIRES_NEW permission refresh while the originating transaction still
      retains its connection, exhausting the pool.
    resolution: >-
      Permission mutation facades complete TransactionTemplate cleanup and release
      their write connection before synchronous fresh locked role publication.
      Mutations inside a pre-existing transaction enqueue publication only after
      successful outer commit on a bounded worker; rejection/failure closes only
      affected sessions. Fresh durable authority and rollback/callback ordering
      remain covered and approved by solution/security review.
    actual: "The original saturation probe now returns 12/12 HTTP 200 in 0.183 seconds and all ten pooled connections become idle."
    evidence: "output/hr-final-pool-probe.log -> output/hr-post-pool-probe.log; HrPermissionPoolIntegrationTest four cases; HrRoomTrackingIntegrationTest 14 cases; renewed solution-review.yaml and security-review.yaml"
    owner: developer-agent
    release_blocking: false
coverage_interpretations:
  - >-
    The generic QA role says next-step, run and language are owner-only, and
    implies unconditional editor clearing on step changes. Accepted OpenSpec
    independent-interviewer-step-navigation and this change explicitly preserve
    interviewer management/published workspace semantics. This conflict was
    escalated to root and resolved in favor of the accepted specification; QA
    did not redefine those existing product permissions or invent failures.
  - >-
    Account sessions have no expiresAt in the existing platform. Actual invalid
    and superseded room-event tokens were tested; account wall-clock expiry is
    not claimed. The security review records a separate nonblocking auth-hardening follow-up.
  - >-
    The 30-second export check verifies configured transaction metadata plus
    documented cooperative renderer checks. It does not prove a hard HTTP
    deadline under an unresponsive database/transport. The separate task-row cap
    and global export semaphore were source-reviewed by security, not independently
    load-tested by this QA pass. The tested supported workload is 1000/5000.
risks:
  - "Nested permission publication is bounded and asynchronous; exceptional rejection/failure closes affected sessions and may require reconnect."
  - "Final browser/runtime evidence uses the corrected 64-case production build; only one test was added afterward and production was restored byte-for-byte before final 65/65 Maven/Gradle verification. Security review's 64-test subtotal therefore describes the same reviewed production source, not a missing production recheck."
  - "Backend/migration must be rolled out before the frontend; rollback must preserve archived-room denial."
  - "Existing non-expiring account bearer sessions and cooperative export deadlines remain documented platform/operational limitations."
