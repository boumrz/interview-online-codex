blocking: false
remediation_checklist:
  - "[x] Enforce HR identity and room permissions server-side"
  - "[x] Keep owner-exclusive archive and access administration owner-only"
  - "[x] Bind guest event tokens to live room/session connections and reject replay/stale authority"
  - "[x] Make reconnect and realtime mutation use current durable permissions"
  - "[x] Serialize archive, invitation, metadata and permission publication races"
  - "[x] Release permission write connections before fresh locked synchronization and prove pool recovery"
  - "[x] Exclude HR metadata and private manager data from candidate payloads"
  - "[x] Scope and bound XLSX generation; write literal cells and always remove temporary data"
  - "[ ] Define platform account-session expiry, revocation and rotation in a separate OpenSpec change"
risks:
  - >-
      Existing usr_ account bearer tokens remain valid indefinitely unless their database
      row is removed; there is no user-facing server logout path in the reviewed baseline.
  - >-
      The 30-second export bound combines a database transaction timeout and cooperative
      renderer checks; it is not a hard wall-clock HTTP cutoff if the database or
      transport itself becomes unresponsive. Row and concurrency caps limit normal-load
      amplification and the verified 1,000/5,000 workload completed well inside the bound.
