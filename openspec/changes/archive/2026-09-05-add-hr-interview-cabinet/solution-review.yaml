risk_summary: >
  Residual release risk is bounded and documented: the 30-second export control
  combines a Spring transaction timeout with cooperative renderer deadline
  checks, so an unresponsive database or transport is not a hard end-to-end
  latency guarantee. Nested permission publication is serialized through one
  bounded in-process worker; saturation and async failure fail closed by
  invalidating affected account connections, so reconnect may be required
  under exceptional load. Backend/migration must be deployed before the
  frontend to preserve archive denial. These are documented operational
  constraints, not unresolved implementation defects.
