resolved_findings:
  - severity: blocking
    description: >
      A pending HR export could complete after logout or account switch and
      download data from the prior account.
    resolution: >
      The export now aborts on token change/unmount and generation-checks the
      canonical session before creating and activating the download anchor.
  - severity: blocking
    description: >
      Direct relay and fresh-room HTTP 410 paths did not consistently stop
      realtime retries and enter the terminal archived-room state.
    resolution: >
      Persisted 410 responses from room GET, main/activity relay, and
      fire-and-forget presence paths now converge on one terminal state and
      stop further retries.
  - severity: blocking
    description: >
      A late private-panel request could restore sensitive metadata after role
      loss and a later re-grant.
    resolution: >
      Panel requests are aborted and generation-guarded across close, role,
      room, and identity changes, with distinct RTK query keys to avoid stale
      pending-query deduplication.
  - severity: major
    description: >
      Mobile cabinet controls were below the approved 44 px target, and an
      unscheduled fallback timestamp could appear as the interview date without
      a visible deterministic source.
    resolution: >
      Mobile cabinet, row, copy, and panel actions meet 44 px at 320 px without
      horizontal overflow. Scheduled time is explicitly absent when unknown;
      the effective fallback time and its finished/created source are visible,
      and the helper states scheduled-then-finished-then-created precedence.
  - severity: blocking
    description: >
      Untracked room deletion omitted the frozen `archived: false` response
      member, and REST/realtime permission callbacks could publish before commit
      or read a stale persistence context after a later demotion.
    resolution: >
      DELETE always returns the required boolean. Account role changes register
      after-commit synchronization; the callback performs a fresh REQUIRES_NEW,
      row-locked durable-role read. Rollback, pre-commit, reconnect, event-token,
      realtime mutation, and delayed-callback ordering cases pass.
  - severity: major
    description: >
      A workbook write failure could be masked by close failure, skip dispose,
      and leave the candidate XLSX file on disk.
    resolution: >
      Cleanup attempts close, dispose, and delete independently, preserves the
      primary failure, attaches cleanup failures as suppressed exceptions, and
      passes the failure-injection cleanup test.
  - severity: blocking
    description: >
      A fresh REQUIRES_NEW permission publication ran inside Spring afterCommit
      while the completed write transaction still retained its connection. Ten
      blocked requests could therefore occupy the entire pool and wait for a
      second connection; the deterministic PostgreSQL probe returned four 500s
      after about 30 seconds.
    resolution: >
      Permission-changing entrypoints now use a nontransactional facade and an
      explicit TransactionTemplate write scope. Calls that own the transaction
      publish synchronously only after transaction cleanup returns the write
      connection; calls participating in an outer transaction enqueue after
      successful commit on a bounded single-thread executor. Publication uses
      a fresh row-locked durable-role read. Queue rejection or asynchronous
      refresh failure closes affected account connections without running the
      database work on the committing thread.
