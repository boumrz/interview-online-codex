test_matrix:
  - id: AC-01
    scenario: "Owner assigns an HR who entered through the candidate link, without entering an ID"
    steps: "Join as authenticated HR; inspect candidate role and empty cabinet; owner opens that participant menu and selects Назначить HR; refresh the HR cabinet."
    expected: "Entry alone grants nothing; confirmed assignment exposes interviewer controls and exactly one tracked room without UUID input."
    result: pass
    evidence: "E_HR: participant HR assignment works without ID entry, reports failure, waits, and survives reconnect and demotion."
  - id: AC-02
    scenario: "Registered and promoted guest interviewers use the same shortcut without gaining owner authority"
    steps: "Owner promotes an ordinary registered or anonymous participant; that interviewer opens an eligible HR menu and assigns HR; inspect available ordinary role controls and reload HR."
    expected: "Both inviter kinds grant durable interviewer access; non-owner inviters have no ordinary promotion/revocation action and target cannot delete the owner's room."
    result: pass
    evidence: "E_HR: separate registered/guest participant cases and primary owner case; B_TRACKING: promoted guest manager can invite an HR account with its event token."
  - id: AC-03
    scenario: "Only authenticated server-confirmed HR accounts are eligible, including mixed sessions"
    steps: "Open menus for ordinary account and guest; connect with spoofed HR/name/userId query fields; enable HR on an account with an old connection, then join with a refreshed connection."
    expected: "Ordinary/guest participants have no HR action; spoofing grants nothing; one merged authenticated participant preserves the refreshed HR flag while remaining a candidate."
    result: pass
    evidence: "E_HR primary and registered/guest cases; B_PROJECTION both cases; focused mixed-session mutation killed."
  - id: AC-04
    scenario: "Assigned state is clear and repeated/offline assignment remains idempotent"
    steps: "Assign through the menu; reopen it; repeat the same existing PUT and run concurrent invitations; invite an account without a current room connection."
    expected: "The HR badge and disabled HR назначен state follow server confirmation; only one membership/association remains and the account receives durable access on entry."
    result: pass
    evidence: "E_HR registered/guest assigned-state assertions and offline invitation case; B_TRACKING manager invitation is idempotent... and concurrent invitations deduplicate.... The shortcut uses that same unchanged account PUT, so disconnect does not alter its semantics."
  - id: AC-05
    scenario: "Pending, recoverable failure, retry and current archive response"
    steps: "Inject one 503; retry with the request held; inspect disabled Назначаем HR and request count, then release to the real server. Separately return current-context 410 while SSE remains open."
    expected: "Failure does not grant access; pending makes one request and retains candidate role; retry succeeds after server response; current 410 removes the live editor and shows terminal unavailable state."
    result: pass
    evidence: "E_HR primary pending/503 case and participant HR assignment handles current 410...; B_ARCHIVE verifies actual server archive denial independently of browser fault injection."
  - id: AC-06
    scenario: "Current actor authority, stored target eligibility and minimal projection"
    steps: "Submit invitations as candidate or revoked manager and for missing/non-HR targets; attempt stale-token/state operations before delayed callbacks; inspect participant payload fields."
    expected: "Unauthorized requests cannot create membership/tracking; current durable role wins; missing/non-HR targets retain established denial semantics; no email/auth/event token is added to participant entries."
    result: pass
    evidence: "B_TRACKING invitation hides missing and non-HR targets and rejects candidate callers, committed HR demotion overrides a stale active session..., and delayed invitation callback cannot restore...; B_PROJECTION payload assertions; security-review PASS."
  - id: AC-07
    scenario: "Demotion, reconnect, reassignment and obsolete response invalidation"
    steps: "Remove assigned HR's interviewer access; reload and request cabinet detail; explicitly reassign. Hold inviter assignment, demote then regrant inviter, and deliver the old 410."
    expected: "Demotion persists as candidate with cabinet denial; explicit assignment restores one original row; old completion cannot terminate the new authorized context or leave controls pending."
    result: pass
    evidence: "E_HR primary demotion/reload/regrant case, stale 410 case and existing private-panel lifecycle case; B_TRACKING durable tombstone/callback cases. Room/account/session generation dependencies and canonical token checks independently approved by solution/security review; those dimensions are not claimed as separate newly executed E2E cases."
  - id: AC-08
    scenario: "Existing optional HR profile, ordinary room roles, private notes and absent-HR ID flow persist"
    steps: "Register with/without HR checkbox; opt in later; use ordinary interviewer promotion and the existing ID invitation form; inspect candidate note access and switch authenticated accounts."
    expected: "HR stays an account eligibility marker; room roles retain existing meaning; absent-HR ID invitation and private note boundaries remain functional; account data is isolated."
    result: pass
    evidence: "E_HR all ten prior HR cases passed again; E_ROLES, E_ACCOUNT and E_PRESENCE passed on final runtime."
