  - "Accepted existing interviewer workspace/publication semantics govern step/run/language access; this change does not redefine them. Account wall-clock expiry does not exist in the baseline, so only invalidated/superseded token denial is claimed."
  - "The initial browser menu-mount timing assertion was fixed by waiting for menu mount; final 15/15 passed without a production correction."
risks:
