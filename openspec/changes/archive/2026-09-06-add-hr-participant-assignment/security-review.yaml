findings: []
controls_verified:
  identity_and_permissions:
    - >-
      CollaborationService initializes isHr from the authenticated User returned by
      AuthService. RealtimeController accepts neither a claimed isHr nor userId as
      identity. Anonymous participants remain ineligible.
    - >-
      ParticipantIdentity separates user, guest and session namespaces. any(isHr)
      aggregates only sessions with the same identity; an older pre-opt-in session
      cannot hide a refreshed authenticated HR session. No account/token/email
      projection was added beyond the accepted public eligibility Boolean.
    - >-
      The existing PUT locks the active room, requires current manager authority
      before resolving the target, rereads stored isHr, and atomically upserts durable
      interviewer membership plus a unique HR assignment. Missing/non-HR targets
      share the established 404 response. Owner membership is not downgraded.
    - >-
      TopBar uses separate canAssignHr/canManageRoom and owner-only canGrantAccess
      gates. The server still rejects ordinary role grant/revoke by non-owners;
      no role enum, code-execution path or owner capability was broadened.
    - >-
      The shortcut introduces no invite credential. A promoted guest uses the existing
      random room-bound live-connection event token, which becomes invalid when its
      connection is removed. Authenticated event-token authority is resolved from
      current durable membership, so a stale session cannot bypass demotion.
  consistency_and_lifetime:
    - >-
      Existing room locking, commit-before-publication, fresh durable permission reads
      and the bounded permission-sync executor remain byte-for-byte unchanged.
      Reconnect uses persisted membership; retrying the idempotent PUT cannot create
      duplicate tracking rows. Browser cancellation does not pretend to undo a commit.
    - >-
      RoomPage synchronously records pending targets, prevents duplicate submission
      and competing ordinary role actions, and applies no optimistic role or permission
      update. Visible role state continues to arrive from the server.
    - >-
      Each operation is guarded by a request generation, request identity and canonical
      auth token. Layout cleanup invalidates requests on room/account/token/authority/
      connection/session changes and unmount. onState additionally invalidates each
      authority transition synchronously, including loss and regain batched by React.
    - >-
      Only a current request may apply success, failure or 410. Current 410 delegates
      to the existing terminal hook, which closes SSE, cancels retries and drops relay
      and activity queues. Stale 410 cannot terminate a later authorized context.
