output_summary: >-
  Verified authenticated HR provenance, account-scoped multisession aggregation,
  stored target validation, current manager authority, owner-only ordinary role
  administration, guest event credentials, durable reconnect behavior, request
  generation/abort guards and the existing terminal 410 transition. This review
