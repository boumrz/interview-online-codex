  role_clarity:
    applicability: changed
    result: >-
      Pass for the changed controls: eligible candidates offer Назначить HR;
      assigned eligible interviewers show HR and HR назначен. Owners retain
      ordinary role actions; non-owner managers do not acquire them. Owner
      targets remain excluded. General pre-existing owner-badge presentation
      is outside this bounded review.
  step_visibility:
    applicability: adjacent
    result: "Pass in both screenshots: Шаг 1 из 1 and the active step remain visible when the participant menu is open."
  step_switching:
    applicability: unchanged
    result: "No step-switching action or authority is changed by this shortcut; no new step UX claim."
  run_code:
    applicability: unchanged
    result: "Code execution controls and permissions are explicitly outside this change and were not retested."
  join_flow:
    applicability: changed
    result: >-
      Pass against the recorded browser evidence: candidate-link admission
      remains candidate admission; explicit manager assignment is the visible
      transition, without asking the joined HR to find or copy an ID.
  error_loading_empty_states:
    applicability: changed
    result: >-
      Pass: Назначаем HR… disables repeat and ordinary role actions for the
      target; named success uses role=status, errors use role=alert outside the
      closed menu and give a retry instruction. Ineligible/absent targets have
      no enabled shortcut. Current-context 410 uses the existing unavailable
      screen. Browser evidence covers pending, failure and retry.
  reconnect_state:
    applicability: existing_transition_reused
    result: >-
      Existing room connection/unavailable presentation is reused. Recorded
      reconnect, demotion, regrant and stale-completion checks preserve the
      displayed authority; this change introduces no separate reconnect screen.
  mobile_consideration:
    applicability: changed
    result: >-
      Pass at the required laptop minimum: both 1280-pixel screenshots show
      readable menu items and an unobscured HR badge. Long names truncate while
      button accessible names retain full identity. No claim of a new mobile
      device audit is made.
