  backend_regression: 18 Surefire XML suites total 87 tests, zero failures, errors, or skips.
  backend_command: Maven package exited 0; output/hr-revoke-baseline/backend-full.log.
  browser_regression: browser-green.log reports 23 passed, zero failed, cancelled, or skipped.
  browser_coverage: Both surfaces, active tabs, offline target, self-removal, retry, current/stale 410, and regrant.
  role_regression: roles-green.log reports INTERVIEWER_ROLE_NOTES_CHAT_OK.
  account_regression: account-switch-green.log reports ACCOUNT_SWITCH_FRESH_DATA_OK.
  frontend_static: Root confirms typecheck and build exit 0; corresponding named logs inspected.
  environment_correction: Test-only open-in-view=false matches production and resolves MockMvc SSE pool exhaustion.
  evidence_location: output/hr-revoke-baseline
