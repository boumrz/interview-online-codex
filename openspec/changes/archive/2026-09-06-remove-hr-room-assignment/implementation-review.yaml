  browser_logs: browser-red.log, browser-stale-red.log, browser-pending-red.log under the baseline directory.
  backend_red: backend-red.log reports 20 failures, including missing DELETE 405 and ordering assertions.
  level_choice: Browser E2E for visible flows; documented integration exception for security and transactions.
green_evidence:
