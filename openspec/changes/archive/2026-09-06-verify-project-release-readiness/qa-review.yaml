coverage_review:
  corrected_inventory_gap:
    source: "frontend/tests/e2e/interview/e2e-activity-timeline-grouping.mjs:1009"
    initial_issue: >-
      The child process uses --test-name-pattern=activity FIFO and executes only
      three of eight recovery cases. File execution was initially mistaken for
      execution of the full file, omitting five cases from this audit.
    resolution: >-
      Root ran the unchanged complete file separately on Docker15173: eight
      passed, zero failed/skipped. Full history/reload, read failure/revocation,
      unfinished error bodies, pending/empty/read timeout/retry and cross-page
      grouping now have fresh evidence. The original 46-command run is retained.
  remaining_entrypoints: >-
    Source search found no other filtered child test suites or skip/only markers
    in frontend unit/contract/script tests. The demo subprocess renders a PDF
    preview. All four focused Yjs scenario names appear in the passing Docker log.
    scenario-environment.json is a later snapshot; root separately confirmed
    unchanged inherited environment without scenario or deadline overrides.
  meaningful_oracles: >-
    Coverage includes server-side negative authorization, account isolation,
    HR assignment/removal and archive, real XLSX validation, durable UUID/history
    assertions, paging, retry, reconnect, step/workspace changes and editor equality.
    Process success is not substituted for these assertions or for unexecuted
    later phases after a failing acceptance condition.
  test_only_scope: >-
    Backend HTTP diagnostic messages and Metrika finite-page teardown preserve
    product assertions. This verification-only change requires no artificial
    behavioral RED. Existing application failures remain evidence for separately
    specified, test-first fixes; production behavior was not changed here.

blocking_findings:
  - id: RELEASE-ACTIVITY-DURABILITY
    basis: "Full-Docker workload and later SQL aggregate retain 1399/1400 expected events."
    evidence: multi-durable-counts.json
    limit: "1400 successful-header diagnostics do not establish 1400 distinct acknowledged UUIDs; the exact loss path is unproven."
    release_condition: "Reproduce with exact action/request/ACK UUID membership, repair the confirmed cause, then pass unchanged 2100-event and all-editor-equality workload."
  - id: RELEASE-AUTH-NAVIGATION
    basis: "Registration succeeds, token is set, clearAuth removes it on dashboard eight milliseconds later, and the next document starts without a token."
    evidence: auth-navigation-diagnostic.json
    release_condition: "Fix session loss during immediate post-registration navigation/reload; preserve and pass the original language-default scenario."
  - id: RELEASE-ADMIN-REGISTRATION
    basis: "Static source shows public nickname-based administrator assignment with case-sensitive uniqueness and case-insensitive privilege selection."
    release_condition: "Remove public privilege selection and verify authorized provisioning plus nickname case variants with negative server tests."
  - id: RELEASE-FAULT-CONTROL
    basis: "Static source shows fault mutation accepts an authenticated actor without administrator or target-room authority checks."
    release_condition: "Disable production fault control by default and enforce server authorization when explicitly enabled."

