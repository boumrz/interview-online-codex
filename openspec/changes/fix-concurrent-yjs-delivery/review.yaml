implementation_checks:
  - "Heartbeat replacement cannot remove nonempty deltas or cancel the actual in-flight request, including a token-free request away from queue index zero."
  - "The former 300-message content eviction is removed; remaining valid entries are retained for subsequent dispatch."
  - "prepareQueuedMessage merges only adjacent nonempty public yjs_update entries sharing an original nonempty syncKey and never attempted. Heartbeats, other actions, attempted entries, another key or the 64 KiB encoded-input boundary stop the group."
  - "Installed Y.mergeUpdates retains every constituent update. Decode/merge failure returns the original head before queue splice, preserving the remaining entries."
  - "The latest constituent supplies operationId, clientEventSequence, yjsClientSequence, code, full snapshot and its original baseServerYjsSequence together; oldest queue time is retained. Contiguous grouping cannot overtake an intervening sequenced action."
  - "The batch is marked attempted before fetch. Recovery and retries retain its complete payload; later edits cannot be merged into an uncertain accepted batch."
  - "Acknowledgments remove the exact settled object, so concurrent recovery filtering cannot shift away another message."
  - "Recovery retains public incremental edits only for the authoritative invite/step/language key. Task changes and terminal access failure retain their discard and server authorization fences."
  - "Server operation deduplication, increasing mutation sequences, snapshot freshness and manager/candidate visibility checks are unchanged by the repair."

